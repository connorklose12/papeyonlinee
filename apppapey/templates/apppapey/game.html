<!DOCTYPE html>
<html>
<head>
<title>Papey Online</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
#ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#0f0;font:bold 16px 'Courier New';background:#000;padding:4px 12px;border:2px solid #0f0;display:none;image-rendering:pixelated;letter-spacing:2px}
#gameover{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;flex-direction:column;color:#0f0;font:bold 48px 'Courier New';text-align:center}
#gameover button{font-size:20px;margin-top:30px;padding:12px 32px;cursor:pointer;border:3px solid #0f0;border-radius:0;background:#000;color:#0f0;font-family:'Courier New';letter-spacing:2px}
#gameover button:hover{background:#0f0;color:#000}
#game{border:4px solid #333;display:none;image-rendering:pixelated;image-rendering:crisp-edges}
#leaderboard{position:fixed;top:10px;right:10px;color:#0f0;font:12px 'Courier New';background:#000;padding:8px 12px;border:2px solid #333;display:none;min-width:140px;letter-spacing:1px}
#leaderboard div{display:flex;align-items:center;gap:6px;margin:2px 0}
#leaderboard .swatch{width:10px;height:10px;flex-shrink:0}
#modeSelect{display:flex;flex-direction:column;gap:20px;align-items:center}
#modeSelect button{font:bold 20px 'Courier New';padding:16px 40px;cursor:pointer;border:3px solid #0f0;border-radius:0;background:#000;color:#0f0;letter-spacing:3px}
#modeSelect button:hover{background:#0f0;color:#000}
</style>
</head>
<body>
<div id="modeSelect">
  <div>
    <button onclick="startGame('online')">Play Online</button>
    <div id="onlineStatus" style="color:#ccc;font:14px Arial;margin-top:6px;text-align:center">checking who's online…</div>
  </div>
  <button style="padding:8px;font:12px Arial" onclick="startGame('cpu')">Play vs CPUs</button>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8870245131405924"
     crossorigin="anonymous"></script>
</div>
<div id="ui">0% covered</div>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8870245131405924"
     crossorigin="anonymous"></script>
<div id="leaderboard"></div>
<div id="gameover">
  <span id="gameoverTitle">GAME OVER</span>
  <br><span id="deathMsg" style="font-size:26px"></span>
  <br><button onclick="location.reload()">Play Again</button>
</div>
<canvas id="game" width="750" height="500"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui=document.getElementById('ui'),leaderboardEl=document.getElementById('leaderboard');
const gameoverEl=document.getElementById('gameover'),deathMsg=document.getElementById('deathMsg'),gameoverTitle=document.getElementById('gameoverTitle');

const W=1000,H=1000,VIEWW=750,VIEWH=500,ZOOM=4.1;
const COLORS=['#99ccff','#ff9999','#ccffcc','#ffcc99','#cc99ff','#ccffff','#ffccff','#ffffcc','#CCFF66','#c7c7c7'];
const opposite={left:'right',right:'left',up:'down',down:'up'};
const speed=1.2;
let mode=null,direction=null,alive=true,frames=0,ws=null,myId=null;

const usedColorSet=new Set();
function claimColor(color){usedColorSet.add(color);return color;}
function releaseColor(color){usedColorSet.delete(color);}
function nextFreeColor(){
  for(const c of COLORS)if(!usedColorSet.has(c))return claimColor(c);
  const h=Math.floor(Math.random()*360);
  const c=`hsl(${h},100%,50%)`;
  usedColorSet.add(c);return c;
}

(function checkOnlineStatus(){
  try{
    const proto=location.protocol==='https:'?'wss':'ws';
    const peek=new WebSocket(`${proto}://${location.host}/ws/game/`);
    let done=false;
    peek.onmessage=e=>{
      if(done)return;
      const d=JSON.parse(e.data);
      if('totalOnline' in d){
        done=true;
        const n=Math.max(0,d.totalOnline-1);
        document.getElementById('onlineStatus').textContent=
          n>0?`${n} player${n===1?'':'s'} online`:'nobody online right now — join and wait!';
        peek.close();
      }
    };
    peek.onerror=()=>document.getElementById('onlineStatus').textContent='server offline';
  }catch(e){}
})();

function makeEntity(x,y,color){
  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const cx=c.getContext('2d');
  cx.fillStyle=color;cx.globalAlpha=0.4;cx.fillRect(x-5,y-5,10,10);
  cx.globalAlpha=1;cx.strokeStyle=color;cx.lineWidth=1;cx.strokeRect(x-5,y-5,10,10);
  return{x,y,color,trail:[],alive:true,outside:false,
         canvas:c,ctx:cx,homeX:x,homeY:y,filledPixels:100,
         dir:null,timer:0};
}

claimColor(COLORS[0]);
const player=makeEntity(W/2,H/2,COLORS[0]);
const entities=[player];
const remotePlayers={};

const CPU_COUNT=9;

function spotIsFree(x,y){
  if(x<15||x>W-15||y<15||y>H-15)return false;
  for(const e of entities){
    if(!e.alive)continue;
    const d=e.ctx.getImageData(x-6,y-6,12,12).data;
    for(let i=3;i<d.length;i+=4)if(d[i]>0)return false;
  }
  return true;
}

function findFreeSpawnSpot(){
  for(let i=0;i<60;i++){
    const x=15+Math.random()*(W-30),y=15+Math.random()*(H-30);
    if(spotIsFree(x,y))return{x,y};
  }
  return null;
}

function startCpuMode(){
  entities.push(makeEntity(player.x+30,player.y-30,nextFreeColor()));
  for(let i=1;i<CPU_COUNT;i++){
    const s=findFreeSpawnSpot();
    if(s)entities.push(makeEntity(s.x,s.y,nextFreeColor()));
  }
}

function scheduleReplacementCpu(deadColor){
  releaseColor(deadColor);
  setTimeout(()=>{
    if(mode!=='cpu')return;
    const s=findFreeSpawnSpot();
    if(s){const color=nextFreeColor();entities.push(makeEntity(s.x,s.y,color));}
  },1500);
}

function moved(e,d){
  return{
    x:e.x-(d==='left')*speed+(d==='right')*speed,
    y:e.y-(d==='up')*speed+(d==='down')*speed
  };
}

function scoreCpuDir(cpu,d){
  const p=moved(cpu,d);
  if(p.x<3||p.x>W-7||p.y<3||p.y>H-7)return-Infinity;
  if(d===opposite[cpu.dir])return-Infinity;
  if(nearTrailPoint(cpu.trail,p.x+2,p.y+2,3))return-Infinity;
  const distHome=Math.hypot(p.x-cpu.homeX,p.y-cpu.homeY);
  const curDist=Math.hypot(cpu.x-cpu.homeX,cpu.y-cpu.homeY);
  const trailLen=cpu.trail.length;
  let score=0;
  if(!cpu.outside){score+=(distHome-curDist)*2;}
  else if(trailLen<25){score+=(distHome-curDist)*2;if(d===cpu.dir)score+=1;}
  else{score+=(curDist-distHome)*3;if(d===cpu.dir)score+=1;if(trailLen>60)score+=(trailLen-60)*0.8;}
  return score;
}

function chooseCpuDir(cpu){
  let best=null,bestScore=-Infinity;
  for(const d of['left','right','up','down']){const s=scoreCpuDir(cpu,d);if(s>bestScore){bestScore=s;best=d;}}
  return best;
}

function updateCpu(cpu){
  if(!cpu.alive)return;
  cpu.timer=(cpu.timer||0)+1;
  const currentBlocked=!cpu.dir||scoreCpuDir(cpu,cpu.dir)===-Infinity;
  const timeToRethink=cpu.timer>8+Math.random()*7;
  const nearWall=cpu.x<8||cpu.x>W-12||cpu.y<8||cpu.y>H-12;
  const trailTooLong=cpu.outside&&cpu.trail.length>35;
  if(currentBlocked||timeToRethink||nearWall||trailTooLong){
    const best=chooseCpuDir(cpu);
    if(best!==null){cpu.dir=best;cpu.timer=0;}
  }
  if(scoreCpuDir(cpu,cpu.dir)===-Infinity){const fallback=chooseCpuDir(cpu);if(fallback)cpu.dir=fallback;}
  const p=moved(cpu,cpu.dir||'right');
  cpu.x=Math.max(0,Math.min(W-4,p.x));
  cpu.y=Math.max(0,Math.min(H-4,p.y));
  if(!isInOwnTerritory(cpu))cpu.outside=true;
  if(cpu.outside&&isInOwnTerritory(cpu)){fillEnclosed(cpu);return;}
  if(cpu.outside&&checkOwnTrailHit(cpu)){const c=cpu.color;killEntity(cpu);scheduleReplacementCpu(c);return;}
  checkGotRunInto(cpu);
  if(!cpu.alive){scheduleReplacementCpu(cpu.color);return;}
  if(cpu.outside)cpu.trail.push({x:cpu.x+2,y:cpu.y+2});
}

// FOR THE ONLINE MODE

function startOnlineMode(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/game/`);

  ws.onopen=()=>{
    console.log('Connected to game server');
  };

  ws.onmessage=event=>{
    const data=JSON.parse(event.data);

    // identity + existing players
    if(data.myId){
      myId=data.myId;
      if(data.existing){
        const existingIds=Object.keys(data.existing);
        if(existingIds.length===0){
          // No existing players moves player to a random free spot
          const s=findFreeSpawnSpot();
          if(s) movePlayerTo(s.x,s.y);
        } else {
          // Loads all territory PNGs, then pick a free spawn once they're all drawn
          let pending=existingIds.length;
          for(const id of existingIds){
            const state=data.existing[id];
            createOrUpdateRemote(id,state,false);
            if(state.territoryPng){
              const img=new Image();
              img.onload=img.onerror=()=>{
                remotePlayers[id].ctx.clearRect(0,0,W,H);
                if(img.complete&&img.naturalWidth)remotePlayers[id].ctx.drawImage(img,0,0);
                if(--pending===0){const s=findFreeSpawnSpot();if(s)movePlayerTo(s.x,s.y);}
              };
              img.src=state.territoryPng;
            } else {
              if(--pending===0){const s=findFreeSpawnSpot();if(s)movePlayerTo(s.x,s.y);}
            }
          }
        }
      }
      return;
    }

    // online-count update (also sent after connect)
    if('totalOnline' in data) return;

    // territory PNG pushed after another player fills
    if(data.__territory__){
      const rp=remotePlayers[data.__territory__];
      if(rp&&data.territoryPng){
        const img=new Image();
        img.onload=()=>{ rp.ctx.clearRect(0,0,W,H); rp.ctx.drawImage(img,0,0); };
        img.src=data.territoryPng;
      }
      return;
    }

    // player left
    if(data.__left__){
      const id=data.__left__;
      if(remotePlayers[id]){
        releaseColor(remotePlayers[id].color);
        entities.splice(entities.indexOf(remotePlayers[id]),1);
        delete remotePlayers[id];
      }
      return;
    }

    // regular position broadcast 
    for(const id in data){
      if(id===myId)continue;
      createOrUpdateRemote(id,data[id],false);
    }
    // remove players not in this broadcast
    for(const id in remotePlayers){
      if(!(id in data)){
        releaseColor(remotePlayers[id].color);
        entities.splice(entities.indexOf(remotePlayers[id]),1);
        delete remotePlayers[id];
      }
    }
  };

  ws.onclose=()=>{ if(alive) die('Disconnected from server'); };
  ws.onerror=e=>console.error('WS error',e);
}

// Teleport the local player to a new spawn position and repaint their home square
function movePlayerTo(x,y){
  player.ctx.clearRect(0,0,W,H);
  player.x=x; player.y=y; player.homeX=x; player.homeY=y;
  player.ctx.fillStyle=player.color;player.ctx.globalAlpha=0.4;player.ctx.fillRect(x-5,y-5,10,10);
  player.ctx.globalAlpha=1;player.ctx.strokeStyle=player.color;player.ctx.lineWidth=1;player.ctx.strokeRect(x-5,y-5,10,10);
}

function createOrUpdateRemote(id,state,applyTerritory){
  if(!remotePlayers[id]){
    const color=nextFreeColor();
    const spawnX=state.x||Math.random()*W;
    const spawnY=state.y||Math.random()*H;
    const rp=makeEntity(spawnX,spawnY,color);
    remotePlayers[id]=rp;
    entities.push(rp);
  }
  const rp=remotePlayers[id];
  rp.x=state.x??rp.x;
  rp.y=state.y??rp.y;
  rp.trail=state.trail||[];
  rp.outside=rp.trail.length>0;
  rp.filledPixels=state.filledPixels??rp.filledPixels;

  if(applyTerritory&&state.territoryPng){
    const img=new Image();
    img.onload=()=>{ rp.ctx.clearRect(0,0,W,H); rp.ctx.drawImage(img,0,0); };
    img.src=state.territoryPng;
  }
}

function captureMyTerritory(){
  return player.canvas.toDataURL('image/png');
}

function sendMyState(includePng){
  if(!ws||ws.readyState!==WebSocket.OPEN)return;
  const payload={x:player.x,y:player.y,trail:player.trail,filledPixels:player.filledPixels};
  if(includePng)payload.territoryPng=captureMyTerritory();
  try{ ws.send(JSON.stringify(payload)); }catch(e){}
}

// SHARED GAME LOGIC BETWEEN BOTH THE MODES

function isInOwnTerritory(e){
  const px=Math.floor(e.x+2),py=Math.floor(e.y+2);
  if(px<0||px>=W||py<0||py>=H)return false;
  return e.ctx.getImageData(px,py,1,1).data[3]>0;
}

function die(reason){
  alive=false;player.alive=false;
  gameoverTitle.textContent='GAME OVER';
  deathMsg.textContent=reason;
  gameoverEl.style.display='flex';
  if(ws)ws.close();
  lbFrame=0;updateLeaderboard();
}

function win(){
  alive=false;
  gameoverTitle.textContent='🎉 YOU WIN!';
  deathMsg.textContent='100% of the map covered!';
  gameoverEl.style.display='flex';
  if(ws)ws.close();
}

function getPercent(e){return((e.filledPixels||0)/(W*H)*100).toFixed(1);}

let lbFrame=0;
function updateLeaderboard(){
  if(++lbFrame%15!==0)return;
  const ranked=entities.filter(e=>e.alive)
    .map(e=>({color:e.color,pct:parseFloat(getPercent(e)),isPlayer:e===player}))
    .sort((a,b)=>b.pct-a.pct);
  leaderboardEl.innerHTML=ranked.map((r,i)=>
    `<div><span class="swatch" style="background:${r.color}"></span>#${i+1} ${r.isPlayer?'<b>You</b>':r.color} — ${r.pct}%</div>`).join('');
}

function killEntity(victim,reason){
  victim.alive=false;victim.trail=[];
  if(victim===player)die(reason||'You were eliminated!');
}

function nearTrailPoint(trail,cx,cy,r,start=0,end=trail.length){
  for(let i=start;i<end;i++)
    if(Math.abs(trail[i].x-cx)<r&&Math.abs(trail[i].y-cy)<r)return true;
  return false;
}

function checkOwnTrailHit(e){
  return e.trail.length>=20&&nearTrailPoint(e.trail,e.x+2,e.y+2,2,0,e.trail.length-10);
}

function checkGotRunInto(self){
  if(!self.outside||!self.trail.length)return;
  for(const other of entities){
    if(other===self||!other.alive)continue;
    if(nearTrailPoint(self.trail,other.x+2,other.y+2,3))
      return killEntity(self,'Your trail was cut!');
  }
}

function fillEnclosed(entity){
  if(entity.trail.length>1){
    entity.ctx.beginPath();
    entity.ctx.strokeStyle=entity.color;entity.ctx.lineWidth=4;
    entity.ctx.lineJoin='miter';entity.ctx.lineCap='square';
    entity.ctx.moveTo(entity.trail[0].x,entity.trail[0].y);
    for(let i=1;i<entity.trail.length;i++)entity.ctx.lineTo(entity.trail[i].x,entity.trail[i].y);
    entity.ctx.stroke();
    entity.ctx.lineWidth=5;
    entity.ctx.beginPath();
    entity.ctx.moveTo(entity.trail[0].x,entity.trail[0].y);
    entity.ctx.lineTo(entity.x+2,entity.y+2);
    entity.ctx.stroke();
  }

  const bx=0,by=0,bw=W,bh=H;
  const imageData=entity.ctx.getImageData(bx,by,bw,bh);
  const data=imageData.data;
  const outside=new Uint8Array(bw*bh);
  const stack=[];
  for(let x=0;x<bw;x++){stack.push(x,bw*(bh-1)+x);}
  for(let y=1;y<bh-1;y++){stack.push(y*bw,y*bw+bw-1);}
  const tmp=document.createElement('canvas');tmp.width=tmp.height=1;
  const tc=tmp.getContext('2d');
  tc.fillStyle=entity.color;tc.fillRect(0,0,1,1);
  const[cr,cg,cb]=tc.getImageData(0,0,1,1).data;
  while(stack.length){
    const idx=stack.pop();
    if(idx<0||idx>=bw*bh||outside[idx]||data[idx*4+3]>0)continue;
    outside[idx]=1;
    stack.push(idx+1,idx-1,idx+bw,idx-bw);
  }
  let newlyFilled=0;
  for(let i=0;i<bw*bh;i++){
    if(!outside[i]){
      const pi=i*4;
      if(data[pi+3]===0)newlyFilled++;
      data[pi]=cr;data[pi+1]=cg;data[pi+2]=cb;data[pi+3]=100;
    }
  }
  for(let i=0;i<bw*bh;i++){
    const pi=i*4;
    if(data[pi+3]>0){data[pi]=cr;data[pi+1]=cg;data[pi+2]=cb;data[pi+3]=100;}
  }
  entity.ctx.putImageData(imageData,bx,by);
  entity.filledPixels=(entity.filledPixels||0)+newlyFilled;

  for(const other of entities){
    if(other===entity||!other.alive)continue;
    const oi=other.ctx.getImageData(bx,by,bw,bh);
    const od=oi.data;
    let erased=0;
    for(let i=0;i<od.length;i+=4){
      if(data[i+3]>0&&od[i+3]>0){od[i+3]=0;erased++;}
    }
    other.ctx.putImageData(oi,bx,by);
    if(erased)other.filledPixels=Math.max(0,(other.filledPixels||0)-erased);
  }

  entity.trail=[];entity.outside=false;

  if(entity===player){
    const pct=getPercent(player);
    ui.textContent=pct+'% covered';
    if(pct>=100)win();
    if(mode==='online')sendMyState(true);
  }
}

//RENDERING

function drawEntity(e){
  if(!e.alive)return;
  ctx.drawImage(e.canvas,0,0);
  if(e.outside&&e.trail.length>1){
    ctx.beginPath();
    ctx.strokeStyle=e.color;ctx.lineWidth=4;ctx.lineJoin='miter';ctx.lineCap='square';
    ctx.moveTo(e.trail[0].x,e.trail[0].y);
    for(let i=1;i<e.trail.length;i++)ctx.lineTo(e.trail[i].x,e.trail[i].y);
    ctx.stroke();
  }
  ctx.fillStyle='black';ctx.fillRect(e.x-1,e.y-1,6,6);
  ctx.fillStyle=e.color;ctx.fillRect(e.x,e.y,4,4);
}

function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,VIEWW,VIEWH);
  ctx.save();
  ctx.translate(VIEWW/2,VIEWH/2);
  ctx.scale(ZOOM,ZOOM);
  ctx.translate(-(player.x+2),-(player.y+2));
  ctx.fillStyle='#eee';ctx.fillRect(0,0,W,H);
  entities.forEach(drawEntity);
  ctx.restore();
}

function gameLoop(){
  if(!alive){requestAnimationFrame(gameLoop);return;}
  frames++;
  const p=direction?moved(player,direction):player;
  player.x=p.x;player.y=p.y;

  if(frames>30&&(player.x<-2||player.x>W-3||player.y<-2||player.y>H-3))
    return die('You hit a wall!');

  if(direction){
    if(!isInOwnTerritory(player))player.outside=true;
    checkGotRunInto(player);
    if(!alive)return;
    if(player.outside&&isInOwnTerritory(player)){
      fillEnclosed(player);
    } else if(player.outside){
      if(checkOwnTrailHit(player))return die('You hit your own trail!');
      player.trail.push({x:player.x+2,y:player.y+2});
    }
  }

  if(mode==='cpu')entities.slice(1).forEach(updateCpu);
  else sendMyState(false);

  draw();
  updateLeaderboard();
  requestAnimationFrame(gameLoop);
}

// INPUTS

document.addEventListener('keydown',e=>{
  if(!alive)return;
  const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
  if(d&&d!==opposite[direction])direction=d;
});

let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!alive)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  let d;
  if(Math.abs(dx)>Math.abs(dy))d=dx>0?'right':'left';
  else d=dy>0?'down':'up';
  if(d!==opposite[direction])direction=d;
  e.preventDefault();
},{passive:false});

// START

function startGame(m){
  mode=m;
  document.getElementById('modeSelect').style.display='none';
  canvas.style.display='block';
  ui.style.display='block';
  leaderboardEl.style.display='block';
  mode==='cpu'?startCpuMode():startOnlineMode();
  gameLoop();
}
</script>
</body>
</html>
